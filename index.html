<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e10">
  <meta name="description" content="带着白色微光走过细线勾勒的迷宫，找到那一扇金色出口。">
  <title>微光迷宫</title>
  <link rel="icon" href="./mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-brand" viewBox="0 0 36 36">
      <path d="M3.5 15.5v-12h29v23m0 4v2h-29v-13m0 3h6v-13h17v17h-11v-11h5v5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
      <circle cx="20.5" cy="20.5" r="2" fill="currentColor"/>
    </symbol>
    <symbol id="i-hint" viewBox="0 0 20 20"><path d="m8.2 2 .95 3.5 3.35 1-3.35 1.05L8.2 11l-1-3.45L3.85 6.5l3.35-1L8.2 2Zm6.05 7.7.8 2.45 2.3.75-2.3.75-.8 2.55-.75-2.55-2.35-.75 2.35-.75.75-2.45ZM3.2 16.7l2.55-2.6"/></symbol>
    <symbol id="i-new" viewBox="0 0 20 20"><path d="M3 5.2h2.4c3.8 0 5.4 9.6 9.1 9.6H17m-3-2.6 3 2.6-3 2.5M3 14.8h2.4c1.4 0 2.6-1.5 3.6-3.3m2-3C12 6.6 13.1 5.2 14.5 5.2H17m-3-2.5 3 2.5-3 2.6"/></symbol>
    <symbol id="i-zoom-in" viewBox="0 0 20 20"><circle cx="8.55" cy="8.55" r="5.65"/><path d="m12.65 12.65 4.55 4.55M6 8.55h5.1m-2.55-2.5v5.05"/></symbol>
    <symbol id="i-zoom-out" viewBox="0 0 20 20"><circle cx="8.55" cy="8.55" r="5.65"/><path d="m12.65 12.65 4.55 4.55M6 8.55h5.1"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 20 20"><path d="M10 16V4.5m-5 5 5-5 5 5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.1"/><path d="M10 5.7v4.7l3.1 1.7"/></symbol>
  </svg>

  <main class="game">
    <header class="toolbar">
      <h1 class="brand"><svg viewBox="0 0 36 36" aria-hidden="true"><use href="#i-brand"/></svg>微光迷宫</h1>
      <div class="legend" aria-label="地图图例">
        <span><i class="light-token" aria-hidden="true"></i>你的位置</span>
        <span><i class="gate-token" aria-hidden="true"></i>出口</span>
      </div>
      <div class="actions">
        <button type="button" id="zoom" class="btn zoom" aria-label="放大迷宫" title="放大迷宫">
          <svg class="icon" aria-hidden="true"><use id="zoom-icon" href="#i-zoom-in"/></svg><span id="zoom-name">放大</span>
        </button>
        <button type="button" id="hint" class="btn hint" title="照亮前方几步（H）" aria-label="提示，照亮前方几步">
          <svg class="icon" aria-hidden="true"><use href="#i-hint"/></svg><span>提示</span><kbd>H</kbd>
        </button>
        <button type="button" id="new" class="btn new" title="换一座新迷宫">
          <svg class="icon" aria-hidden="true"><use href="#i-new"/></svg><span>换一座</span>
        </button>
      </div>
    </header>

    <section class="stage" id="stage" tabindex="0" aria-label="迷宫游戏区域" aria-describedby="instructions">
      <svg id="field" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="黑色细线迷宫。白色光点是你，金色菱形是出口。" preserveAspectRatio="none"></svg>
      <span class="corner tl" aria-hidden="true"></span><span class="corner tr" aria-hidden="true"></span>
      <span class="corner bl" aria-hidden="true"></span><span class="corner br" aria-hidden="true"></span>
      <div id="toast" class="toast" aria-hidden="true"></div>
    </section>

    <footer class="hud">
      <div class="controls" id="instructions">
        <span class="key-help"><span class="arrow-keys"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></span><span class="between">或</span><kbd class="letter-keys">WASD</kbd><span>移动</span></span>
        <span class="touch-help">滑动白光，走向金色出口</span>
      </div>
      <div class="stats">
        <span class="step-stat"><span class="stat-label">步数</span><span class="number" id="step-count">0</span></span>
        <span class="time-stat"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg><span class="sr">用时</span><time class="number" id="time">00:00</time></span>
      </div>
      <div class="pad" aria-label="移动方向">
        <button type="button" data-dir="0" class="up" aria-label="向上移动"><svg class="icon"><use href="#i-arrow"/></svg></button>
        <button type="button" data-dir="3" class="left" aria-label="向左移动"><svg class="icon"><use href="#i-arrow"/></svg></button>
        <button type="button" data-dir="2" class="down" aria-label="向下移动"><svg class="icon"><use href="#i-arrow"/></svg></button>
        <button type="button" data-dir="1" class="right" aria-label="向右移动"><svg class="icon"><use href="#i-arrow"/></svg></button>
      </div>
    </footer>
    <p class="sr" id="announcement" role="status" aria-live="polite"></p>
  </main>

  <dialog id="finish" aria-labelledby="finish-title">
    <div class="finish-sigil" aria-hidden="true"><i class="gate-token"></i></div>
    <h2 id="finish-title">找到出口了</h2>
    <p id="finish-stats"></p>
    <div class="finish-actions"><button type="button" class="btn" id="see-route">回看路线</button><button type="button" class="btn new" id="again">再走一座</button></div>
  </dialog>
  <script type="module" src="./game.mjs"></script>
</body>
</html>
